[project]
name = "deterministic-llm-cpu"
version = "0.1.0"
description = "Verifying bit-level computational determinism of small language models on CPU using marimo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "gguf>=0.19.0",
    "marimo>=0.11.0",
    "torch>=2.4.0",
    "transformers>=4.48.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
